[project]
name = "predictive-thermostat"
version = "0.7.0"
requires-python = ">=3.14.2"
description = "Local observation scaffold for a predictive Home Assistant thermostat"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = [".bootstrap"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.14"
files = ["custom_components/predictive_thermostat"]
check_untyped_defs = true
disallow_untyped_defs = true
follow_imports = "silent"
