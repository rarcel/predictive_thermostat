reset_fault:
  name: Acknowledge and reset a fault
  description: >-
    Clears a latched control fault after confirming that the heater state is
    available. Any previous pending command is abandoned and cycle protections
    restart from the currently observed heater state.
  target:
    entity:
      integration: predictive_thermostat
      domain: climate
  fields:
    confirmed_off_period:
      name: Confirm that the off period has elapsed
      description: >-
        Use only after verifying that the heater has physically remained off
        for at least the configured minimum-off and cooldown durations.
      required: false
      default: false
      selector:
        boolean:
